[package]
name = "tempoch-py"
version = "0.5.1"
edition = "2021"
description = "Python bindings for tempoch astronomical time primitives"
license = "AGPL-3.0"
repository = "https://github.com/Siderust/tempoch-py"
authors = ["VPRamon <vallespuigramon@gmail.com>"]

[lib]
name = "tempoch_py"
crate-type = ["rlib", "cdylib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
tempoch = "0.11.2"
pyo3 = { version = "0.30.1", features = ["chrono"] }
chrono = "0.4.44"

[dev-dependencies]
pyo3 = { version = "0.30.1", features = ["auto-initialize", "chrono"] }
approx = "0.5"
